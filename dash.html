<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Rotation wrapper */
  #rotation-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    transition: transform 0.4s ease;
  }

  #rotation-wrapper.rotate-90  { transform: rotate(90deg);  width: 100vh; height: 100vw; }
  #rotation-wrapper.rotate-180 { transform: rotate(180deg); }
  #rotation-wrapper.rotate-270 { transform: rotate(270deg); width: 100vh; height: 100vw; }

  /* Grid layout */
  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    padding: 24px;
    max-width: 760px;
    width: 100%;
  }

  /* Card base */
  .card {
    background: #1a1a1a;
    border-radius: 22px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }

  /* ============ CLOCK ============ */
  .clock-card { grid-column: 1; grid-row: 1; aspect-ratio: 1; }

  .clock-face {
    width: 90%;
    aspect-ratio: 1;
    position: relative;
  }

  .clock-face svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Digital time label */
  .time-label {
    margin-top: 17px;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: #aaaaaa;
    font-family: 'Courier New', monospace;
  }


  /* ============ CALENDAR ============ */
  .calendar-card {
    grid-column: 2;
    grid-row: 1;
    aspect-ratio: 1;
    padding: 14px 15px;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .cal-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
    width: 100%;
  }
  .cal-month {
    font-size: 14px;
    font-weight: bold;
    color: #e05555;
    letter-spacing: 0.10em;
    font-family: Helvetica, Arial, sans-serif;
  }
  .cal-year {
    font-size: 14px;
    color: #888888;
    letter-spacing: 0.06em;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 300;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    width: 100%;
  }
  .cal-day-name {
    text-align: center;
    font-size: 9px;
    color: #777777;
    font-family: Helvetica, Arial, sans-serif;
    letter-spacing: 0.08em;
    padding: 2px 0;
    font-weight: 600;
  }
  .cal-day {
    text-align: center;
    font-size: 11px;
    color: #cccccc;
    font-family: Helvetica, Arial, sans-serif;
    padding: 3px 1px;
    border-radius: 50%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 400;
  }
  .cal-day.today {
    background: #e05555;
    color: #ffffff;
    font-weight: bold;
    border-radius: 50%;
  }
  .cal-day.empty { color: transparent; }
  .cal-day.other-month { color: #444444; }

  /* ============ WEATHER ============ */
  .weather-card {
    grid-column: 3;
    grid-row: 1;
    aspect-ratio: 1;
    gap: 6px;
    padding: 16px;
  }

  .weather-city {
    font-size: 11px;
    color: #888888;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  .weather-icon {
    font-size: 36px;
    line-height: 1;
    margin: 4px 0;
  }
  .weather-temp {
    font-size: 30px;
    font-weight: bold;
    color: #ffffff;
    font-family: Georgia, serif;
    letter-spacing: -0.02em;
  }
  .weather-desc {
    font-size: 10px;
    color: #aaaaaa;
    text-align: center;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .weather-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    margin-top: 6px;
    width: 100%;
  }
  .weather-meta-item {
    font-size: 9px;
    color: #666666;
    font-family: 'Courier New', monospace;
    text-align: center;
    letter-spacing: 0.04em;
    background: #222222;
    border-radius: 8px;
    padding: 5px 4px;
  }
  .weather-meta-item:last-child {
    grid-column: 1 / -1;
  }
  .weather-meta-item span {
    display: block;
    color: #aaaaaa;
    font-size: 10px;
    margin-top: 2px;
  }

  .weather-loading {
    font-size: 10px;
    color: #666;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  .weather-error {
    font-size: 10px;
    color: #cc5555;
    font-family: 'Courier New', monospace;
    text-align: center;
  }

  /* ============ SETTINGS ============ */
  .settings-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    /* positioned at the bottom of the rotated viewport */
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    z-index: 50;
    transition: transform 0.4s ease;
    transform-origin: center center;
  }

  /* Counter-rotate just the button so text is always readable, bar stays at visual bottom */
  body.rot-90  .settings-bar {
    bottom: auto; top: 0; right: auto; left: 0;
    width: auto; height: 100vh;
    flex-direction: column;
    padding: 0 0 0 16px;
  }
  body.rot-90  .settings-bar .settings-btn { transform: rotate(90deg); }

  body.rot-180 .settings-bar { bottom: auto; top: 16px; }
  body.rot-180 .settings-bar .settings-btn { transform: rotate(180deg); }

  body.rot-270 .settings-bar {
    bottom: auto; top: 0; left: auto; right: 0;
    width: auto; height: 100vh;
    flex-direction: column;
    padding: 0 16px 0 0;
  }
  body.rot-270 .settings-bar .settings-btn { transform: rotate(-90deg); }


  .settings-btn {
    background: #1a1a1a;
    border: none;
    border-radius: 12px;
    color: #aaaaaa;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .settings-btn:active, .settings-btn.active {
    background: #333333;
    color: #ffffff;
  }

  /* Settings panel */
  .settings-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .settings-panel.open { display: flex; }

  .settings-box {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 28px 32px;
    min-width: 280px;
    color: #cccccc;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .settings-box h2 {
    font-size: 14px;
    letter-spacing: 0.12em;
    color: #ffffff;
    text-transform: uppercase;
    margin-bottom: 4px;
    font-family: Georgia, serif;
  }
  .settings-box label {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #777;
    text-transform: uppercase;
    display: block;
    margin-bottom: 5px;
  }
  .settings-box input, .settings-box select {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #cccccc;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
  }
  .settings-box input:focus, .settings-box select:focus {
    border-color: #555;
  }
  .settings-save {
    background: #e05555;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 10px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .settings-close {
    background: #2a2a2a;
    border: none;
    border-radius: 10px;
    color: #aaa;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 10px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .settings-row { display: flex; gap: 8px; }
  .settings-row > * { flex: 1; }
</style>
</head>
<body>

<div id="rotation-wrapper">
  <div class="dashboard">

    <!-- CLOCK -->
    <div class="card clock-card">
      <div class="clock-face" id="clockFace">
        <svg id="clockSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Face -->
          <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
          <!-- Tick marks injected by JS -->
          <g id="tickGroup"></g>
          <!-- Hands -->
          <line id="hourHand"   x1="50" y1="50" x2="50" y2="24" stroke="#1a1a1a" stroke-width="4"   stroke-linecap="round"/>
          <line id="minuteHand" x1="50" y1="50" x2="50" y2="17" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
          <line id="secondHand" x1="50" y1="50" x2="50" y2="14" stroke="#c8860a" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Center dot -->
          <circle cx="50" cy="50" r="4"   fill="#c8860a"/>
          <circle cx="50" cy="50" r="1.8" fill="#1a1a1a"/>
        </svg>
      </div>
      <div class="time-label" id="timeLabel">--:-- --</div>
    </div>

    <!-- CALENDAR -->
    <div class="card calendar-card" id="calendarCard">
      <!-- built by JS -->
    </div>

    <!-- WEATHER -->
    <div class="card weather-card" id="weatherCard">
      <div class="weather-loading">Loading weather…</div>
    </div>

  </div>
</div>

<!-- Settings bar - fixed, counter-rotates with page -->
<div class="settings-bar">
  <button class="settings-btn" onclick="openSettings()">⚙ Settings</button>
</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-box">
    <h2>Dashboard Settings</h2>

    <div>
      <label>City Name</label>
      <input type="text" id="settingCity" placeholder="e.g. Atlanta" />
    </div>

    <div>
      <label>Temperature Unit</label>
      <select id="settingUnit">
        <option value="imperial">Fahrenheit (°F)</option>
        <option value="metric">Celsius (°C)</option>
      </select>
    </div>

    <div>
      <label>Page Rotation</label>
      <select id="settingRotation">
        <option value="0">Normal (0°)</option>
        <option value="90">90° Clockwise</option>
        <option value="180">Upside Down (180°)</option>
        <option value="270">90° Counter-Clockwise</option>
      </select>
    </div>

    <div class="settings-row">
      <button class="settings-save" onclick="saveSettings()">Save</button>
      <button class="settings-close" onclick="closeSettings()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ─── STORAGE ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'kindle_dashboard_v1';

function loadPrefs() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch { return {}; }
}

function savePrefs(obj) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}

let prefs = loadPrefs();
if (!prefs.city)     prefs.city     = 'Atlanta';
if (!prefs.unit)     prefs.unit     = 'imperial';
if (!prefs.rotation) prefs.rotation = '0';

// ─── SETTINGS UI ─────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settingCity').value     = prefs.city;
  document.getElementById('settingUnit').value     = prefs.unit;
  document.getElementById('settingRotation').value = prefs.rotation;
  document.getElementById('settingsPanel').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
}

function saveSettings() {
  prefs.city     = document.getElementById('settingCity').value.trim() || 'Atlanta';
  prefs.unit     = document.getElementById('settingUnit').value;
  prefs.rotation = document.getElementById('settingRotation').value;
  savePrefs(prefs);
  closeSettings();
  applyRotation();
  fetchWeather();
}

// ─── ROTATION ────────────────────────────────────────────────────────────────
const rotations = ['0','90','180','270'];

function applyRotation() {
  const w = document.getElementById('rotation-wrapper');
  w.className = '';
  if (prefs.rotation !== '0') w.classList.add('rotate-' + prefs.rotation);
  // Update body class so settings bar counter-rotates correctly
  document.body.className = prefs.rotation !== '0' ? 'rot-' + prefs.rotation : '';
}

function cycleRotation() {
  const idx = rotations.indexOf(prefs.rotation);
  prefs.rotation = rotations[(idx + 1) % rotations.length];
  savePrefs(prefs);
  applyRotation();
}

// ─── CLOCK ───────────────────────────────────────────────────────────────────
(function buildTicks() {
  var g = document.getElementById('tickGroup');
  for (var i = 0; i < 60; i++) {
    var angle = (i / 60) * 360;
    var isMajor = (i % 5 === 0);
    var rad = (angle - 90) * Math.PI / 180;
    var r1 = isMajor ? 40 : 43;
    var r2 = 47;
    var x1 = 50 + r1 * Math.cos(rad);
    var y1 = 50 + r1 * Math.sin(rad);
    var x2 = 50 + r2 * Math.cos(rad);
    var y2 = 50 + r2 * Math.sin(rad);
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? '#555555' : '#aaaaaa');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);
  }
})();

function rotateHand(el, deg) {
  el.setAttribute('transform', 'rotate(' + deg + ' 50 50)');
}

function updateClock() {
  var now = new Date();
  var s   = now.getSeconds();
  var m   = now.getMinutes();
  var h   = now.getHours() % 12;

  var sDeg = s * 6;
  var mDeg = m * 6 + s * 0.1;
  var hDeg = h * 30 + m * 0.5;

  rotateHand(document.getElementById('secondHand'), sDeg);
  rotateHand(document.getElementById('minuteHand'), mDeg);
  rotateHand(document.getElementById('hourHand'),   hDeg);

  var hr = now.getHours(), ampm = 'AM';
  if (hr >= 12) { ampm = 'PM'; if (hr > 12) hr -= 12; }
  if (hr === 0) hr = 12;
  var mm = String(m).padStart(2, '0');
  document.getElementById('timeLabel').textContent = hr + ':' + mm + ' ' + ampm;
}

setInterval(updateClock, 1000);
updateClock();


// ─── CALENDAR ────────────────────────────────────────────────────────────────
function buildCalendar() {
  const card  = document.getElementById('calendarCard');
  const now   = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  const monthNames = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                      'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const dayNames   = ['S','M','T','W','T','F','S'];

  const firstDay  = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let html = `
    <div class="cal-header">
      <span class="cal-month">${monthNames[month]}</span>
      <span class="cal-year">${year}</span>
    </div>
    <div class="cal-grid">
  `;

  dayNames.forEach(d => html += `<div class="cal-day-name">${d}</div>`);

  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === today;
    html += `<div class="cal-day${isToday ? ' today' : ''}">${d}</div>`;
  }

  const remainder = (firstDay + daysInMonth) % 7;
  if (remainder > 0) {
    for (let i = 0; i < (7 - remainder); i++)
      html += `<div class="cal-day other-month"></div>`;
  }

  html += '</div>';
  card.innerHTML = html;
}

buildCalendar();

// ─── WEATHER ─────────────────────────────────────────────────────────────────
const API_KEY = '0264a07ef00385ae3a6ea69858c85c52';

const weatherIcons = {
  'Clear': '☀️',
  'Clouds': '☁️',
  'Rain': '🌧️',
  'Drizzle': '🌦️',
  'Thunderstorm': '⛈️',
  'Snow': '❄️',
  'Mist': '🌫️',
  'Fog': '🌫️',
  'Haze': '🌫️',
  'Smoke': '🌫️',
  'Dust': '💨',
  'Sand': '💨',
  'Ash': '🌋',
  'Squall': '💨',
  'Tornado': '🌪️',
};

function fetchWeather() {
  var card = document.getElementById('weatherCard');
  var city = prefs.city;
  var unit = prefs.unit;
  var unitSymbol = unit === 'imperial' ? '°F' : '°C';

  card.innerHTML = '<div class="weather-loading">Fetching weather\u2026</div>';

  var url = 'https://api.openweathermap.org/data/2.5/weather?q=' + encodeURIComponent(city) + '&appid=' + API_KEY + '&units=' + unit;

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 15000;

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;

    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        var main      = data.weather[0].main;
        var desc      = data.weather[0].description;
        var temp      = Math.round(data.main.temp);
        var feelsLike = Math.round(data.main.feels_like);
        var humidity  = data.main.humidity;
        var windSpeed = Math.round(data.wind.speed);
        var wind      = unit === 'imperial' ? windSpeed + ' mph' : windSpeed + ' m/s';
        var icon      = weatherIcons[main] || '\uD83C\uDF21';
        var cityDisp  = data.name.toUpperCase();

        card.innerHTML =
          '<div class="weather-city">' + cityDisp + '</div>' +
          '<div class="weather-icon">' + icon + '</div>' +
          '<div class="weather-temp">' + temp + unitSymbol + '</div>' +
          '<div class="weather-desc">' + desc + '</div>' +
          '<div class="weather-meta">' +
            '<div class="weather-meta-item">FEELS<span>' + feelsLike + unitSymbol + '</span></div>' +
            '<div class="weather-meta-item">HUM<span>' + humidity + '%</span></div>' +
            '<div class="weather-meta-item">WIND<span>' + wind + '</span></div>' +
          '</div>';
      } catch (e) {
        card.innerHTML = '<div class="weather-error">\u26A0 Parse error</div>';
      }
    } else if (xhr.status === 404) {
      card.innerHTML = '<div class="weather-error">\u26A0 City not found<br><br><small style="color:#555">Check city name in settings</small></div>';
    } else if (xhr.status === 401) {
      card.innerHTML = '<div class="weather-error">\u26A0 Invalid API key</div>';
    } else {
      card.innerHTML = '<div class="weather-error">\u26A0 Error ' + xhr.status + '<br><br><small style="color:#555">Check your connection</small></div>';
    }
  };

  xhr.ontimeout = function() {
    card.innerHTML = '<div class="weather-error">\u26A0 Request timed out<br><br><small style="color:#555">Check your connection</small></div>';
  };

  xhr.onerror = function() {
    card.innerHTML = '<div class="weather-error">\u26A0 Network error<br><br><small style="color:#555">Check your connection</small></div>';
  };

  xhr.send();
}

// Refresh weather every 10 minutes
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);

// ─── INIT ────────────────────────────────────────────────────────────────────
applyRotation();
</script>
</body>
</html>
