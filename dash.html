<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kindle Dashboard</title>
<style>
  * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100%;
    overflow: hidden;
  }

  /* Rotation wrapper */
  #rotation-wrapper {
    width: 100%;
    height: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
  }

  #rotation-wrapper.rotate-90  { -webkit-transform: rotate(90deg);  transform: rotate(90deg); }
  #rotation-wrapper.rotate-180 { -webkit-transform: rotate(180deg); transform: rotate(180deg); }
  #rotation-wrapper.rotate-270 { -webkit-transform: rotate(270deg); transform: rotate(270deg); }

  /* Grid layout — use table-based fallback friendly display */
  .dashboard {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    gap: 20px;
    padding: 18px 18px 70px 18px;
    max-width: 760px;
    width: 100%;
  }

  /* Top row: 3 equal cards */
  .top-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    gap: 20px;
    width: 100%;
  }

  /* Card base */
  .card {
    background: #1a1a1a;
    border-radius: 18px;
    padding: 16px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }

  /* ============ CLOCK ============ */
  .clock-card {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    /* fixed height instead of aspect-ratio (not supported on Kindle WebKit) */
    height: 170px;
  }

  .clock-face {
    width: 120px;
    height: 120px;
    position: relative;
  }

  .clock-face svg {
    width: 120px;
    height: 120px;
    display: block;
  }

  .time-label {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #aaaaaa;
    font-family: 'Courier New', monospace;
  }

  /* ============ CALENDAR ============ */
  .calendar-card {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    height: 170px;
    padding: 12px 10px;
    -webkit-box-align: start;
    -webkit-align-items: flex-start;
    align-items: flex-start;
    -webkit-box-pack: start;
    -webkit-justify-content: flex-start;
    justify-content: flex-start;
  }

  .cal-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: baseline;
    -webkit-align-items: baseline;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 8px;
    width: 100%;
  }
  .cal-month {
    font-size: 13px;
    font-weight: bold;
    color: #e05555;
    letter-spacing: 0.08em;
    font-family: Helvetica, Arial, sans-serif;
  }
  .cal-year {
    font-size: 12px;
    color: #888888;
    letter-spacing: 0.04em;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 300;
  }

  .cal-grid {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    width: 100%;
  }
  .cal-day-name {
    width: 14.28%;
    text-align: center;
    font-size: 8px;
    color: #777777;
    font-family: Helvetica, Arial, sans-serif;
    letter-spacing: 0.06em;
    padding: 1px 0;
    font-weight: 600;
  }
  .cal-day {
    width: 14.28%;
    text-align: center;
    font-size: 10px;
    color: #cccccc;
    font-family: Helvetica, Arial, sans-serif;
    padding: 2px 0;
    font-weight: 400;
  }
  .cal-day.today {
    background: #e05555;
    color: #ffffff;
    font-weight: bold;
    border-radius: 50%;
  }
  .cal-day.empty { color: transparent; }
  .cal-day.other-month { color: #444444; }

  /* ============ WEATHER ============ */
  .weather-card {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    height: 170px;
    gap: 4px;
    padding: 12px 10px;
  }

  .weather-city {
    font-size: 10px;
    color: #888888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  /* ASCII-art weather icon — works on all renderers */
  .weather-icon {
    font-size: 22px;
    line-height: 1;
    margin: 3px 0;
    font-family: 'Courier New', monospace;
    color: #ffffff;
    text-align: center;
    letter-spacing: -0.05em;
  }
  .weather-temp {
    font-size: 26px;
    font-weight: bold;
    color: #ffffff;
    font-family: Georgia, serif;
    letter-spacing: -0.02em;
  }
  .weather-desc {
    font-size: 9px;
    color: #aaaaaa;
    text-align: center;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .weather-meta {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
    width: 100%;
  }
  .weather-meta-item {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 40%;
    flex: 1 1 40%;
    font-size: 8px;
    color: #dbdbdb;
    font-family: 'Courier New', monospace;
    text-align: center;
    letter-spacing: 0.03em;
    background: #222222;
    border-radius: 6px;
    padding: 4px 3px;
  }
  .weather-meta-item.full {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 100%;
    flex: 1 1 100%;
  }
  .weather-meta-item span {
    display: block;
    color: #cccccc;
    font-size: 9px;
    margin-top: 1px;
  }
  .weather-loading, .weather-error {
    font-size: 10px;
    color: #666;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  .weather-error { color: #cc5555; }

  /* ============ STOCKS PANEL ============ */
  .stocks-card {
    width: 100%;
    border-radius: 18px;
    background: #1a1a1a;
    padding: 12px 16px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }

  .stocks-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 2px;
  }

  .stocks-title {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #555555;
  }

  .stocks-updated {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #444444;
    letter-spacing: 0.04em;
  }

  .stocks-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    gap: 8px;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
  }

  .stock-item {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    background: #222222;
    border-radius: 10px;
    padding: 8px 10px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 2px;
  }

  .stock-ticker {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: bold;
    color: #aaaaaa;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stock-price {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .stock-change {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.03em;
  }

  .stock-change.up   { color: #55cc88; }
  .stock-change.down { color: #e05555; }
  .stock-change.flat { color: #888888; }

  .stock-dollar {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #9c9c9c;
    letter-spacing: 0.02em;
  }

  .stocks-status {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #ffffff;
    text-align: center;
    padding: 6px 0;
    letter-spacing: 0.05em;
  }

  /* ============ NEWS PANEL ============ */
  .news-card {
    width: 100%;
    border-radius: 18px;
    background: #1a1a1a;
    padding: 14px 16px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    position: relative;
    overflow: hidden;
  }

  .news-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    width: 100%;
  }

  .news-category-tabs {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 4px;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
  }

  .news-tab {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 6px;
    color: #555;
    cursor: pointer;
    border: none;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }
  .news-tab.active {
    background: #e05555;
    color: #fff;
  }

  .news-countdown {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    color: #444;
    letter-spacing: 0.06em;
  }

  .news-items {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 6px;
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
  }

  /* No opacity/transform animation — Kindle e-ink renders transitions poorly */
  .news-item {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: start;
    -webkit-align-items: flex-start;
    align-items: flex-start;
    gap: 6px;
  }

  .news-bullet {
    font-size: 13px;
    color: #e05555;
    margin-top: 0px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }

  .news-text {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #cccccc;
    line-height: 1.4;
    letter-spacing: 0.02em;
  }

  .news-source {
    font-size: 9px;
    color: #555;
    margin-left: 3px;
  }

  .news-status {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #555;
    text-align: center;
    padding: 8px 0;
    letter-spacing: 0.05em;
  }

  .news-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: #e05555;
    width: 0%;
    border-radius: 0 0 0 18px;
  }

  /* ============ SPORTS PANEL ============ */
  .sports-card {
    width: 100%;
    border-radius: 18px;
    background: #1a1a1a;
    padding: 14px 16px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    position: relative;
    overflow: hidden;
  }

  .sports-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    width: 100%;
  }

  .sports-title {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #555555;
  }

  .sports-league-label {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #e05555;
    font-weight: bold;
  }

  .sports-cycle-info {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #444;
    letter-spacing: 0.04em;
  }

  /* Container for 3-game display */
  .sports-games {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    gap: 8px;
    width: 100%;
  }

  /* ── MLB game tile ── */
  .mlb-game {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    background: #222222;
    border-radius: 10px;
    padding: 8px 10px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .mlb-teams {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 3px;
  }

  .mlb-team-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    gap: 4px;
  }

  .mlb-abbr {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: bold;
    color: #cccccc;
    letter-spacing: 0.06em;
    min-width: 26px;
  }

  .mlb-score {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .mlb-score.winning { color: #55cc88; }

  .mlb-divider {
    height: 1px;
    background: #333;
    width: 100%;
    margin: 1px 0;
  }

  .mlb-meta {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 2px;
    margin-top: 2px;
  }

  .mlb-inning {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #aaaaaa;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
  }

  .mlb-bases {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    gap: 3px;
    margin: 1px 0;
  }

  /* diamond-shaped bases using rotated squares */
  .base-diamond {
    width: 8px;
    height: 8px;
    border: 1.5px solid #555;
    -webkit-transform: rotate(45deg);
    transform: rotate(45deg);
    border-radius: 1px;
    display: inline-block;
  }
  .base-diamond.occupied { background: #e05555; border-color: #e05555; }

  .mlb-outs {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    gap: 3px;
  }

  .out-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    border: 1.5px solid #555;
    display: inline-block;
  }
  .out-dot.recorded { background: #e05555; border-color: #e05555; }

  .mlb-status {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #888;
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ── NBA/NHL game tile ── */
  .nba-game, .nhl-game {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    background: #222222;
    border-radius: 10px;
    padding: 8px 10px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .nba-team-row, .nhl-team-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    gap: 4px;
  }

  .nba-team-info, .nhl-team-info {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 5px;
    min-width: 0;
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
  }

  .nba-logo, .nhl-logo {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: 7px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 0;
    text-align: center;
  }

  .nba-abbr, .nhl-abbr {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: bold;
    color: #cccccc;
    letter-spacing: 0.04em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .nba-score, .nhl-score {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: -0.01em;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }

  .nba-score.winning, .nhl-score.winning { color: #55cc88; }

  .nba-divider, .nhl-divider {
    height: 1px;
    background: #333;
    width: 100%;
    margin: 1px 0;
  }

  .nba-meta, .nhl-meta {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 2px;
    margin-top: 1px;
  }

  .nba-clock, .nhl-clock {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    color: #e05555;
    letter-spacing: 0.05em;
    text-align: center;
    font-weight: bold;
  }

  .nba-period, .nhl-period {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #888;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
  }

  .sports-status {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #555;
    text-align: center;
    padding: 8px 0;
    letter-spacing: 0.05em;
  }

  .sports-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: #e05555;
    width: 0%;
    border-radius: 0 0 0 18px;
  }

  /* ============ SETTINGS BAR ============ */
  /* position:fixed is broken on Kindle — use sticky in flow instead */
  .settings-bar {
    width: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 8px;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    padding: 8px 0 4px 0;
  }

  .settings-btn {
    background: #1a1a1a;
    border: none;
    border-radius: 10px;
    color: #aaaaaa;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 0.05em;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Settings panel */
  .settings-panel {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;

<script>
// ─── COMPAT HELPERS ──────────────────────────────────────────────────────────
// Avoid arrow functions and const/let where Kindle WebKit may choke.
// Use var everywhere, classic function declarations, no template literals.

// Safe localStorage wrapper (may be blocked on Kindle)
var storage = (function() {
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    return localStorage;
  } catch(e) {
    // Fallback: in-memory store
    var mem = {};
    return {
      getItem: function(k) { return mem[k] !== undefined ? mem[k] : null; },
      setItem: function(k, v) { mem[k] = String(v); },
      removeItem: function(k) { delete mem[k]; }
    };
  }
})();

// ─── STORAGE ─────────────────────────────────────────────────────────────────
var STORAGE_KEY = 'kindle_dashboard_v2';

function loadPrefs() {
  try {
    var raw = storage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function savePrefs(obj) {
  try { storage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch(e) {}
}

var prefs = loadPrefs();
if (!prefs.city)              prefs.city        = 'Atlanta';
if (!prefs.unit)              prefs.unit        = 'imperial';
if (!prefs.rotation)          prefs.rotation    = '0';
if (prefs.tzOffset === undefined) prefs.tzOffset = -5;
if (!prefs.bottomBlock)       prefs.bottomBlock = 'news';
if (!prefs.sport)             prefs.sport       = 'mlb';

// ─── SETTINGS UI ─────────────────────────────────────────────────────────────
function onBottomBlockChange() {
  var val = document.getElementById('settingBottomBlock').value;
  document.getElementById('settingSportRow').style.display = val === 'sports' ? 'block' : 'none';
}

function openSettings() {
  document.getElementById('settingCity').value        = prefs.city;
  document.getElementById('settingUnit').value        = prefs.unit;
  document.getElementById('settingRotation').value   = prefs.rotation;
  document.getElementById('settingTimezone').value   = String(prefs.tzOffset);
  document.getElementById('settingBottomBlock').value = prefs.bottomBlock;
  document.getElementById('settingSport').value       = prefs.sport;
  onBottomBlockChange();
  document.getElementById('settingsPanel').className = 'settings-panel open';
}
function closeSettings() {
  document.getElementById('settingsPanel').className = 'settings-panel';
}
function saveSettings() {
  var oldBlock = prefs.bottomBlock;
  var oldSport = prefs.sport;
  prefs.city        = document.getElementById('settingCity').value || 'Atlanta';
  prefs.unit        = document.getElementById('settingUnit').value;
  prefs.rotation    = document.getElementById('settingRotation').value;
  prefs.tzOffset    = parseFloat(document.getElementById('settingTimezone').value);
  prefs.bottomBlock = document.getElementById('settingBottomBlock').value;
  prefs.sport       = document.getElementById('settingSport').value;
  savePrefs(prefs);
  closeSettings();
  applyRotation();
  fetchWeather();
  // Switch bottom block if needed
  applyBottomBlock();
  if (prefs.bottomBlock === 'sports' && (oldBlock !== 'sports' || oldSport !== prefs.sport)) {
    initSports();
  }
}

document.getElementById('settingsOpenBtn').onclick  = openSettings;
document.getElementById('settingsSaveBtn').onclick  = saveSettings;
document.getElementById('settingsCloseBtn').onclick = closeSettings;

// ─── ROTATION ────────────────────────────────────────────────────────────────
var rotations = ['0','90','180','270'];
function applyRotation() {
  var w = document.getElementById('rotation-wrapper');
  w.className = '';
  if (prefs.rotation !== '0') w.className = 'rotate-' + prefs.rotation;
}

// ─── CLOCK ───────────────────────────────────────────────────────────────────
(function buildTicks() {
  var g = document.getElementById('tickGroup');
  for (var i = 0; i < 60; i++) {
    var angle = (i / 60) * 360;
    var isMajor = (i % 5 === 0);
    var rad = (angle - 90) * Math.PI / 180;
    var r1 = isMajor ? 40 : 43;
    var r2 = 47;
    var x1 = 50 + r1 * Math.cos(rad);
    var y1 = 50 + r1 * Math.sin(rad);
    var x2 = 50 + r2 * Math.cos(rad);
    var y2 = 50 + r2 * Math.sin(rad);
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? '#555555' : '#aaaaaa');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);
  }
})();

function rotateHand(el, deg) {
  el.setAttribute('transform', 'rotate(' + deg + ' 50 50)');
}

function getAdjustedTime() {
  var now = new Date();
  var utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  var tzMs  = prefs.tzOffset * 3600000;
  return new Date(utcMs + tzMs);
}

function updateClock() {
  var now = getAdjustedTime();
  var s   = now.getSeconds();
  var m   = now.getMinutes();
  var h   = now.getHours() % 12;

  rotateHand(document.getElementById('secondHand'), s * 6);
  rotateHand(document.getElementById('minuteHand'), m * 6 + s * 0.1);
  rotateHand(document.getElementById('hourHand'),   h * 30 + m * 0.5);

  var hr = now.getHours();
  var ampm = hr >= 12 ? 'PM' : 'AM';
  if (hr > 12) hr -= 12;
  if (hr === 0) hr = 12;
  var mm = m < 10 ? '0' + m : String(m);
  document.getElementById('timeLabel').textContent = hr + ':' + mm + ' ' + ampm;
}

setInterval(updateClock, 1000);
updateClock();

// ─── CALENDAR ────────────────────────────────────────────────────────────────
function buildCalendar() {
  var now   = getAdjustedTime();
  var year  = now.getFullYear();
  var month = now.getMonth();
  var today = now.getDate();
  var monthNames = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                    'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  var dayNames = ['S','M','T','W','T','F','S'];
  var firstDay  = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();

  var html = '<div class="cal-header"><span class="cal-month">'
    + monthNames[month] + '</span><span class="cal-year">' + year + '</span></div>'
    + '<div class="cal-grid">';

  for (var di = 0; di < dayNames.length; di++) {
    html += '<div class="cal-day-name">' + dayNames[di] + '</div>';
  }
  for (var i = 0; i < firstDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    html += '<div class="cal-day' + (d === today ? ' today' : '') + '">' + d + '</div>';
  }
  var remainder = (firstDay + daysInMonth) % 7;
  if (remainder > 0) {
    for (var j = 0; j < (7 - remainder); j++) {
      html += '<div class="cal-day other-month"></div>';
    }
  }
  html += '</div>';
  document.getElementById('calendarCard').innerHTML = html;
}
buildCalendar();

// ─── WEATHER ─────────────────────────────────────────────────────────────────
var API_KEY = '0264a07ef00385ae3a6ea69858c85c52';

// Text-based weather icons — emoji are unreliable on Kindle e-ink
var weatherIcons = {
  'Clear':        '☀️',
  'Clouds':       '☁️',
  'Rain':         '🌧️',
  'Drizzle':      '🌦️',
  'Thunderstorm': '⛈️',
  'Snow':         '❄️',
  'Mist':         '🌫️',
  'Fog':          '🌫️',
  'Haze':         '🌁',
  'Smoke':        '🌫️',
  'Dust':         '💨',
  'Sand':         '💨',
  'Ash':          '🌋',
  'Squall':       '💨',
  'Tornado':      '🌪️'
};

function fetchWeather() {
  var card = document.getElementById('weatherCard');
  var unit = prefs.unit;
  var unitSymbol = unit === 'imperial' ? 'F' : 'C';
  card.innerHTML = '<div class="weather-loading">Fetching weather...</div>';

  var url = 'https://api.openweathermap.org/data/2.5/weather?q='
    + encodeURIComponent(prefs.city)
    + '&appid=' + API_KEY
    + '&units=' + unit;

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 15000;

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        var main = data.weather[0].main;
        var desc = data.weather[0].description;
        var temp = Math.round(data.main.temp);
        var feelsLike = Math.round(data.main.feels_like);
        var humidity = data.main.humidity;
        var windSpeed = Math.round(data.wind.speed);
        var wind = unit === 'imperial' ? (windSpeed + ' mph') : (windSpeed + ' m/s');
        var icon = weatherIcons[main] || '🌡️';
        card.innerHTML =
          '<div class="weather-city">' + data.name.toUpperCase() + '</div>' +
          '<div class="weather-icon">' + icon + '</div>' +
          '<div class="weather-temp">' + temp + '&deg;' + unitSymbol + '</div>' +
          '<div class="weather-desc">' + desc + '</div>' +
          '<div class="weather-meta">' +
            '<div class="weather-meta-item">FEELS LIKE<span>' + feelsLike + '&deg;' + unitSymbol + '</span></div>' +
            '<div class="weather-meta-item">HUMIDITY<span>' + humidity + '%</span></div>' +
            '<div class="weather-meta-item full">WIND<span>' + wind + '</span></div>' +
          '</div>';
      } catch(e) {
        card.innerHTML = '<div class="weather-error">Parse error</div>';
      }
    } else if (xhr.status === 404) {
      card.innerHTML = '<div class="weather-error">City not found</div>';
    } else if (xhr.status === 401) {
      card.innerHTML = '<div class="weather-error">Invalid API key</div>';
    } else {
      card.innerHTML = '<div class="weather-error">Error ' + xhr.status + '</div>';
    }
  };
  xhr.ontimeout = function() { card.innerHTML = '<div class="weather-error">Timed out</div>'; };
  xhr.onerror   = function() { card.innerHTML = '<div class="weather-error">Network error</div>'; };
  xhr.send();
}
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);

// ─── STOCKS ───────────────────────────────────────────────────────────────────
var STOCK_SYMBOLS = ['^GSPC', '^DJI', '^IXIC', 'AAPL', 'TSLA', 'NVDA'];
var STOCK_LABELS  = { '^GSPC': 'S&P 500', '^DJI': 'DOW', '^IXIC': 'NASDAQ',
                      'AAPL': 'AAPL', 'TSLA': 'TSLA', 'NVDA': 'NVDA' };

// Parse Yahoo Finance JSON — handles both v8 chart and quote endpoints
function parseYahooJson(text) {
  var data = JSON.parse(text);

  // ── v8/finance/chart response ──────────────────────────────────────────────
  if (data && data.chart && data.chart.result && data.chart.result.length) {
    var meta  = data.chart.result[0].meta;
    if (!meta) throw new Error('no meta');
    var price = meta.regularMarketPrice;
    var prev  = meta.chartPreviousClose || meta.previousClose || meta.regularMarketPreviousClose;
    if (!price || !prev) throw new Error('missing price/prev');
    return { price: price, prev: prev };
  }

  // ── v7/finance/quote response ──────────────────────────────────────────────
  if (data && data.quoteResponse && data.quoteResponse.result && data.quoteResponse.result.length) {
    var q     = data.quoteResponse.result[0];
    var price = q.regularMarketPrice;
    var prev  = q.regularMarketPreviousClose;
    if (!price || !prev) throw new Error('missing price/prev');
    return { price: price, prev: prev };
  }

  // ── allorigins wrapper: {contents: "..."} ──────────────────────────────────
  if (data && data.contents) {
    return parseYahooJson(data.contents);   // recurse once on the inner JSON
  }

  throw new Error('unrecognised response shape');
}

// Fetch one symbol using multiple proxies + two Yahoo Finance endpoints
function fetchOneTicker(symbol, callback) {
  var enc      = encodeURIComponent(symbol);
  var chartUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/'  + enc + '?range=1d&interval=1d&includePrePost=false';
  var quoteUrl = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + enc;

  var attempts = [
    // proxy + chart endpoint
    { proxyUrl: 'https://corsproxy.io/?url='               + encodeURIComponent(chartUrl), isJson: false },
    { proxyUrl: 'https://api.allorigins.win/get?url='      + encodeURIComponent(chartUrl), isJson: true  },
    // proxy + quote endpoint (different structure — parseYahooJson handles it)
    { proxyUrl: 'https://corsproxy.io/?url='               + encodeURIComponent(quoteUrl), isJson: false },
    { proxyUrl: 'https://api.allorigins.win/get?url='      + encodeURIComponent(quoteUrl), isJson: true  }
  ];

  var tried = 0;

  function tryNext() {
    if (tried >= attempts.length) { callback(null); return; }
    var attempt = attempts[tried++];
    var xhr = new XMLHttpRequest();
    xhr.open('GET', attempt.proxyUrl, true);
    xhr.timeout = 12000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try {
          // allorigins returns {contents, status} — parseYahooJson unwraps it
          var parsed = parseYahooJson(xhr.responseText);
          var change    = parsed.price - parsed.prev;
          var changePct = (change / parsed.prev) * 100;
          callback({ symbol: symbol, price: parsed.price, change: change, changePct: changePct });
        } catch(e) {
          tryNext();   // bad parse → try next proxy/endpoint
        }
      } else {
        tryNext();
      }
    };
    xhr.ontimeout = tryNext;
    xhr.onerror   = tryNext;
    xhr.send();
  }

  tryNext();
}

function renderStockTile(result) {
  if (!result) return '<div class="stock-item"><div class="stock-ticker" style="color:#e05555">ERR</div><div class="stock-price" style="font-size:10px;color:#666">no data</div></div>';
  var label     = STOCK_LABELS[result.symbol] || result.symbol;
  var price     = result.price;
  var change    = result.change;
  var changePct = result.changePct;
  var dir       = change > 0 ? 'up' : (change < 0 ? 'down' : 'flat');
  var arrow     = change > 0 ? '▲' : (change < 0 ? '▼' : '–');
  var priceFmt  = price >= 1000
    ? price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})
    : price.toFixed(2);
  var dollarFmt = (change >= 0 ? '+' : '') + change.toFixed(2);
  var pctFmt    = (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%';
  // Indices don't have a $ price prefix
  var isIndex   = result.symbol.charAt(0) === '^';
  return '<div class="stock-item">' +
    '<div class="stock-ticker">' + label + '</div>' +
    '<div class="stock-price">' + (isIndex ? '' : '$') + priceFmt + '</div>' +
    '<div class="stock-change ' + dir + '">' + arrow + ' ' + pctFmt + '</div>' +
    '<div class="stock-dollar">' + dollarFmt + '</div>' +
    '</div>';
}

function fetchStocks() {
  var row     = document.getElementById('stocksRow');
  var updated = document.getElementById('stocksUpdated');
  row.innerHTML = '<div class="stocks-status">Fetching markets...</div>';

  var results  = [];
  var fetched  = 0;
  var total    = STOCK_SYMBOLS.length;

  // Stagger requests slightly so Kindle doesn't choke on 6 simultaneous XHRs
  for (var i = 0; i < total; i++) {
    (function(idx, sym) {
      setTimeout(function() {
        fetchOneTicker(sym, function(result) {
          results[idx] = result;
          fetched++;
          if (fetched === total) {
            var html = '';
            for (var k = 0; k < total; k++) { html += renderStockTile(results[k]); }
            row.innerHTML = html;
            var now  = new Date();
            var h    = now.getHours();
            var m    = now.getMinutes();
            var ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            updated.textContent = 'as of ' + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
          }
        });
      }, idx * 300);
    })(i, STOCK_SYMBOLS[i]);
  }
}

// Manual XML item parser — DOMParser('text/xml') is unreliable on Kindle WebKit
function parseRssItems(xml) {
  var results = [];
  // Find all <item>...</item> blocks
  var itemRe = /<item[\s>][\s\S]*?<\/item>/gi;
  var items = xml.match(itemRe);
  if (!items) return results;
  for (var i = 0; i < Math.min(items.length, 4); i++) {
    var block = items[i];
    // Extract <title>...</title> (handles CDATA)
    var titleMatch = block.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/i);
    var raw = titleMatch ? titleMatch[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim() : 'Untitled';
    var dashIdx = raw.lastIndexOf(' - ');
    results.push({
      title:  dashIdx > 0 ? raw.slice(0, dashIdx) : raw,
      source: dashIdx > 0 ? raw.slice(dashIdx + 3) : ''
    });
  }
  return results;
}

// XHR-based fetch with two CORS proxies; no async/await
function fetchWithProxyXhr(feedUrl, callback) {
  var encoded = encodeURIComponent(feedUrl);
  var proxies = [
    { url: 'https://api.allorigins.win/get?url=' + encoded, json: true },
    { url: 'https://corsproxy.io/?url=' + encoded,          json: false }
  ];
  var tried = 0;

  function tryNext() {
    if (tried >= proxies.length) { callback(null); return; }
    var proxy = proxies[tried++];
    var xhr = new XMLHttpRequest();
    xhr.open('GET', proxy.url, true);
    xhr.timeout = 12000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        var text = xhr.responseText;
        try {
          if (proxy.json) {
            var data = JSON.parse(text);
            if (data && data.contents) { callback(data.contents); return; }
          } else {
            if (text.indexOf('<rss') !== -1 || text.indexOf('<feed') !== -1) {
              callback(text); return;
            }
          }
        } catch(e) {}
        tryNext();
      } else {
        tryNext();
      }
    };
    xhr.ontimeout = tryNext;
    xhr.onerror   = tryNext;
    xhr.send();
  }
  tryNext();
}

function fetchNewsCategory(cat, callback) {
  if (newsCache[cat]) { callback(newsCache[cat]); return; }

  fetchWithProxyXhr(newsFeeds[cat], function(xml) {
    if (!xml) {
      callback([{ title: 'Could not load headlines. Check connection.', source: '' }]);
      return;
    }
    var headlines = parseRssItems(xml);
    if (headlines.length === 0) {
      headlines = [{ title: 'No headlines available right now.', source: '' }];
    }
    newsCache[cat] = headlines;
    callback(headlines);
  });
}

// Fetch scores via allorigins → our own API endpoint
// We embed the SportRadar-compatible public endpoint used by ESPN widgets.
// As a Kindle-safe fallback we use allorigins to proxy ESPN's public API.
function fetchSportsScores(league, callback) {
  var espnSport = { mlb: 'baseball/mlb', nba: 'basketball/nba', nhl: 'hockey/nhl' }[league];
  if (!espnSport) { callback([]); return; }

  var apiUrl = 'https://site.api.espn.com/apis/site/v2/sports/' + espnSport + '/scoreboard';
  var proxied = 'https://api.allorigins.win/get?url=' + encodeURIComponent(apiUrl);

  var xhr = new XMLHttpRequest();
  xhr.open('GET', proxied, true);
  xhr.timeout = 15000;

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try {
        var wrapper = JSON.parse(xhr.responseText);
        var raw = wrapper.contents || xhr.responseText;
        var data = JSON.parse(raw);
        var games = parseEspnScoreboard(league, data);
        callback(games);
      } catch(e) {
        callback([]);
      }
    } else {
      // Try direct (some Kindle firmwares allow it)
      var xhr2 = new XMLHttpRequest();
      xhr2.open('GET', apiUrl, true);
      xhr2.timeout = 12000;
      xhr2.onreadystatechange = function() {
        if (xhr2.readyState !== 4) return;
        if (xhr2.status === 200) {
          try {
            var data = JSON.parse(xhr2.responseText);
            callback(parseEspnScoreboard(league, data));
          } catch(e2) { callback([]); }
        } else { callback([]); }
      };
      xhr2.ontimeout = function() { callback([]); };
      xhr2.onerror   = function() { callback([]); };
      xhr2.send();
    }
  };
  xhr.ontimeout = function() { callback([]); };
  xhr.onerror   = function() { callback([]); };
  xhr.send();
}

function parseEspnScoreboard(league, data) {
  var events = data.events || [];
  var games = [];
  for (var i = 0; i < events.length; i++) {
    var ev = events[i];
    var comps = ev.competitions && ev.competitions[0];
    if (!comps) continue;
    var competitors = comps.competitors || [];
    var status = comps.status || {};
    var statusType = status.type || {};
    var state = statusType.state || 'pre'; // pre / in / post

    var home = null, away = null;
    for (var j = 0; j < competitors.length; j++) {
      var c = competitors[j];
      if (c.homeAway === 'home') home = c;
      else away = c;
    }
    if (!home || !away) continue;

    var game = {
      id:        ev.id,
      state:     state,
      homeAbbr:  home.team.abbreviation || '???',
      awayAbbr:  away.team.abbreviation || '???',
      homeName:  home.team.shortDisplayName || home.team.name || '',
      awayName:  away.team.shortDisplayName || away.team.name || '',
      homeScore: parseInt(home.score || '0', 10),
      awayScore: parseInt(away.score || '0', 10),
      displayClock:  status.displayClock || '',
      period:        status.period || 0,
      statusDetail:  statusType.shortDetail || statusType.description || ''
    };

    // MLB specifics
    if (league === 'mlb') {
      var sit = comps.situation || {};
      game.inning    = sit.period || game.period;
      game.inningHalf = (sit.isTopInning !== undefined ? (sit.isTopInning ? 'TOP' : 'BOT') : '');
      game.outs      = sit.outs || 0;
      game.onFirst   = !!(sit.onFirst);
      game.onSecond  = !!(sit.onSecond);
      game.onThird   = !!(sit.onThird);
    }

    games.push(game);
  }
  return games;
}

// ── Renderers ──
function renderMlbGame(game) {
  var homeWin = game.homeScore > game.awayScore;
  var awayWin = game.awayScore > game.homeScore;
  var inningStr = '';
  if (game.state === 'in') {
    inningStr = (game.inningHalf || '') + ' ' + ordinal(game.inning || game.period);
  } else if (game.state === 'post') {

  } else {
    inningStr = 'UPCOMING';
  }

  var basesHtml = '<div class="mlb-bases">'
    + '<div class="base-diamond' + (game.onThird  ? ' occupied' : '') + '"></div>'
    + '<div class="base-diamond' + (game.onSecond ? ' occupied' : '') + '"></div>'
    + '<div class="base-diamond' + (game.onFirst  ? ' occupied' : '') + '"></div>'
    + '</div>';

  var outsHtml = '<div class="mlb-outs">';
  for (var o = 0; o < 3; o++) {
    outsHtml += '<div class="out-dot' + (o < (game.outs || 0) ? ' recorded' : '') + '"></div>';
  }
  outsHtml += '</div>';

  var homeColor = colorFor('mlb', game.homeAbbr);
  var awayColor = colorFor('mlb', game.awayAbbr);

  return '<div class="mlb-game">'
    + '<div class="mlb-teams">'
    + '<div class="mlb-team-row">'
    + '<div class="mlb-abbr" style="color:' + teamTextColor(awayColor) + ';background:' + awayColor + ';border-radius:4px;padding:1px 3px;">' + game.awayAbbr + '</div>'
    + '<div class="mlb-score' + (awayWin ? ' winning' : '') + '">' + game.awayScore + '</div>'
    + '</div>'
    + '<div class="mlb-divider"></div>'
    + '<div class="mlb-team-row">'
    + '<div class="mlb-abbr" style="color:' + teamTextColor(homeColor) + ';background:' + homeColor + ';border-radius:4px;padding:1px 3px;">' + game.homeAbbr + '</div>'
    + '<div class="mlb-score' + (homeWin ? ' winning' : '') + '">' + game.homeScore + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="mlb-meta">'
    + '<div class="mlb-inning">' + inningStr + '</div>'
    + (game.state === 'in' ? basesHtml + outsHtml : '')
    + '</div>'
    + '</div>';
}

function renderNbaGame(game) {
  return renderBracketGame('nba', game);

function renderNhlGame(game) {

function renderBracketGame(league, game) {
  var homeWin = game.homeScore > game.awayScore;
  var awayWin = game.awayScore > game.homeScore;
  var homeColor = colorFor(league, game.homeAbbr);
  var awayColor = colorFor(league, game.awayAbbr);

  var periodLabel = '';

  if (game.state === 'in') {
    clockLabel  = game.displayClock || '';
    if (league === 'nba') {
      periodLabel = ordinal(game.period) + ' QTR';
    } else {
      periodLabel = ordinal(game.period) + ' PER';
    }
  } else if (game.state === 'post') {
    clockLabel  = 'FINAL';
    periodLabel = '';
  } else {
    clockLabel  = 'UPCOMING';
    periodLabel = game.statusDetail || '';
  }

  var cls = league + '-game';
  var rowCls = league + '-team-row';
  var infoCls = league + '-team-info';
  var logoCls = league + '-logo';
  var abbrCls = league + '-abbr';
  var scoreCls = league + '-score';
  var divCls  = league + '-divider';
  var metaCls = league + '-meta';
  var clockCls = league + '-clock';
  var perCls  = league + '-period';

  return '<div class="' + cls + '">'
    + '<div class="' + rowCls + '">'
    + '<div class="' + infoCls + '">'
    + '<div class="' + logoCls + '" style="background:' + awayColor + ';color:' + teamTextColor(awayColor) + '">' + game.awayAbbr + '</div>'

    + '<div class="' + scoreCls + (awayWin ? ' winning' : '') + '">' + game.awayScore + '</div>'
    + '</div>'
    + '<div class="' + divCls + '"></div>'
    + '<div class="' + rowCls + '">'
    + '<div class="' + infoCls + '">'
    + '<div class="' + logoCls + '" style="background:' + homeColor + ';color:' + teamTextColor(homeColor) + '">' + game.homeAbbr + '</div>'
    + '<div class="' + abbrCls + '">' + (game.homeName || game.homeAbbr) + '</div>'
    + '</div>'
    + '<div class="' + scoreCls + (homeWin ? ' winning' : '') + '">' + game.homeScore + '</div>'
    + '</div>'
    + '<div class="' + metaCls + '">'
    + '<div class="' + clockCls + '">' + clockLabel + '</div>'
    + (periodLabel ? '<div class="' + perCls + '">' + periodLabel + '</div>' : '')
    + '</div>'
    + '</div>';
}

// Simple ordinal: 1→1ST, 2→2ND, 3→3RD, 4→4TH etc.
function ordinal(n) {
  var s = ['TH','ST','ND','RD'];
  var v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

// Returns white or black text for a given bg color (hex)
function teamTextColor(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2),16);
  var g = parseInt(hex.substr(2,2),16);
  var b = parseInt(hex.substr(4,2),16);
  var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.55 ? '#111111' : '#ffffff';
}

function renderSportsPage() {
  var league  = sportsState.league;
  var games   = sportsState.games;
  var pageIdx = sportsState.pageIndex;
  var gamesEl = document.getElementById('sportsGames');
  var cycleEl = document.getElementById('sportsCycleInfo');

  if (!games || games.length === 0) {
    gamesEl.innerHTML = '<div class="sports-status">No games available</div>';
    cycleEl.textContent = '';
    return;
  }

  var totalPages = Math.ceil(games.length / 3);
  var start = pageIdx * 3;
  var slice = games.slice(start, start + 3);

  // Pad to 3 if fewer
  var html = '';
  for (var i = 0; i < slice.length; i++) {
    var g = slice[i];
    if (league === 'mlb')      html += renderMlbGame(g);
    else if (league === 'nba') html += renderNbaGame(g);
    else if (league === 'nhl') html += renderNhlGame(g);
  }
  gamesEl.innerHTML = html || '<div class="sports-status">No games on this page</div>';

  if (totalPages > 1) {
    cycleEl.textContent = (pageIdx + 1) + '/' + totalPages;
  } else {
    cycleEl.textContent = '';
  }
}

function startSportsCycle() {
  if (sportsState.cycleTimer)   clearInterval(sportsState.cycleTimer);
  if (sportsState.countdownInt) clearInterval(sportsState.countdownInt);
  if (sportsState.games.length <= 3) return; // only cycle if >3 games

  sportsState.cycleAt = Date.now() + SPORTS_CYCLE_MS;

  sportsState.countdownInt = setInterval(function() {
    var remaining = Math.max(0, sportsState.cycleAt - Date.now());
    var pct = ((SPORTS_CYCLE_MS - remaining) / SPORTS_CYCLE_MS) * 100;
    var bar = document.getElementById('sportsProgress');
    if (bar) bar.style.width = pct + '%';
  }, 500);

  sportsState.cycleTimer = setInterval(function() {
    var totalPages = Math.ceil(sportsState.games.length / 3);
    sportsState.pageIndex = (sportsState.pageIndex + 1) % totalPages;
    renderSportsPage();
    sportsState.cycleAt = Date.now() + SPORTS_CYCLE_MS;
    var bar = document.getElementById('sportsProgress');
    if (bar) bar.style.width = '0%';
  }, SPORTS_CYCLE_MS);
}

function initSports() {
  if (sportsState.cycleTimer)   { clearInterval(sportsState.cycleTimer);   sportsState.cycleTimer = null; }
  if (sportsState.countdownInt) { clearInterval(sportsState.countdownInt); sportsState.countdownInt = null; }
  if (sportsState.fetchTimer)   { clearInterval(sportsState.fetchTimer);   sportsState.fetchTimer = null; }

  var league = prefs.sport || 'mlb';
  sportsState.league    = league;
  sportsState.games     = [];
  sportsState.pageIndex = 0;

  document.getElementById('sportsLeagueLabel').textContent = league.toUpperCase();
  document.getElementById('sportsGames').innerHTML = '<div class="sports-status">Loading scores...</div>';
  document.getElementById('sportsProgress').style.width = '0%';

  function doFetch() {
    fetchSportsScores(league, function(games) {
      if (sportsState.league !== league) return; // league changed
      sportsState.games = games;
      sportsState.pageIndex = 0;
      renderSportsPage();
      startSportsCycle();
    });
  }

  doFetch();
  // Refresh every 2 minutes
  sportsState.fetchTimer = setInterval(doFetch, 2 * 60 * 1000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyBottomBlock();
if (prefs.bottomBlock === 'sports') {
  initSports();
}
</script>
</body>
</html>
