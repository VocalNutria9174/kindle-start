<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kindle Dashboard</title>
<style>
  * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100%;
    overflow: hidden;
  }

  /* Rotation wrapper */
  #rotation-wrapper {
    width: 100%;
    height: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
  }

  #rotation-wrapper.rotate-90  { -webkit-transform: rotate(90deg);  transform: rotate(90deg); }
  #rotation-wrapper.rotate-180 { -webkit-transform: rotate(180deg); transform: rotate(180deg); }
  #rotation-wrapper.rotate-270 { -webkit-transform: rotate(270deg); transform: rotate(270deg); }

  /* Grid layout — use table-based fallback friendly display */
  .dashboard {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    gap: 20px;
    padding: 18px 18px 70px 18px;
    max-width: 760px;
    width: 100%;
  }

  /* Top row: 3 equal cards */
  .top-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    gap: 20px;
    width: 100%;
  }

  /* Card base */
  .card {
    background: #1a1a1a;
    border-radius: 18px;
    padding: 16px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }

  /* ============ CLOCK ============ */
  .clock-card {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    /* fixed height instead of aspect-ratio (not supported on Kindle WebKit) */
    height: 170px;
  }

  .clock-face {
    width: 120px;
    height: 120px;
    position: relative;
  }

  .clock-face svg {
    width: 120px;
    height: 120px;
    display: block;
  }

  .time-label {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #aaaaaa;
    font-family: 'Courier New', monospace;
  }

  /* ============ CALENDAR ============ */
  .calendar-card {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    height: 170px;
    padding: 12px 10px;
    -webkit-box-align: start;
    -webkit-align-items: flex-start;
    align-items: flex-start;
    -webkit-box-pack: start;
    -webkit-justify-content: flex-start;
    justify-content: flex-start;
  }

  .cal-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: baseline;
    -webkit-align-items: baseline;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 8px;
    width: 100%;
  }
  .cal-month {
    font-size: 13px;
    font-weight: bold;
    color: #e05555;
    letter-spacing: 0.08em;
    font-family: Helvetica, Arial, sans-serif;
  }
  .cal-year {
    font-size: 12px;
    color: #888888;
    letter-spacing: 0.04em;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 300;
  }

  .cal-grid {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    width: 100%;
  }
  .cal-day-name {
    width: 14.28%;
    text-align: center;
    font-size: 8px;
    color: #777777;
    font-family: Helvetica, Arial, sans-serif;
    letter-spacing: 0.06em;
    padding: 1px 0;
    font-weight: 600;
  }
  .cal-day {
    width: 14.28%;
    text-align: center;
    font-size: 10px;
    color: #cccccc;
    font-family: Helvetica, Arial, sans-serif;
    padding: 2px 0;
    font-weight: 400;
  }
  .cal-day.today {
    background: #e05555;
    color: #ffffff;
    font-weight: bold;
    border-radius: 50%;
  }
  .cal-day.empty { color: transparent; }
  .cal-day.other-month { color: #444444; }

  /* ============ WEATHER ============ */
  .weather-card {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 0;
    flex: 1 1 0;
    height: 170px;
    gap: 4px;
    padding: 12px 10px;
  }

  .weather-city {
    font-size: 10px;
    color: #888888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  /* ASCII-art weather icon — works on all renderers */
  .weather-icon {
    font-size: 22px;
    line-height: 1;
    margin: 3px 0;
    font-family: 'Courier New', monospace;
    color: #ffffff;
    text-align: center;
    letter-spacing: -0.05em;
  }
  .weather-temp {
    font-size: 26px;
    font-weight: bold;
    color: #ffffff;
    font-family: Georgia, serif;
    letter-spacing: -0.02em;
  }
  .weather-desc {
    font-size: 9px;
    color: #aaaaaa;
    text-align: center;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .weather-meta {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
    width: 100%;
  }
  .weather-meta-item {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 40%;
    flex: 1 1 40%;
    font-size: 8px;
    color: #dbdbdb;
    font-family: 'Courier New', monospace;
    text-align: center;
    letter-spacing: 0.03em;
    background: #222222;
    border-radius: 6px;
    padding: 4px 3px;
  }
  .weather-meta-item.full {
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 100%;
    flex: 1 1 100%;
  }
  .weather-meta-item span {
    display: block;
    color: #cccccc;
    font-size: 9px;
    margin-top: 1px;
  }
  .weather-loading, .weather-error {
    font-size: 10px;
    color: #666;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  .weather-error { color: #cc5555; }

  /* ============ NEWS PANEL ============ */
  .news-card {
    width: 100%;
    border-radius: 18px;
    background: #1a1a1a;
    padding: 14px 16px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    position: relative;
    overflow: hidden;
  }

  .news-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    width: 100%;
  }

  .news-category-tabs {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 4px;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
  }

  .news-tab {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 6px;
    color: #555;
    cursor: pointer;
    border: none;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }
  .news-tab.active {
    background: #e05555;
    color: #fff;
  }

  .news-countdown {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    color: #444;
    letter-spacing: 0.06em;
  }

  .news-items {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 6px;
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
  }

  /* No opacity/transform animation — Kindle e-ink renders transitions poorly */
  .news-item {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: start;
    -webkit-align-items: flex-start;
    align-items: flex-start;
    gap: 6px;
  }

  .news-bullet {
    font-size: 13px;
    color: #e05555;
    margin-top: 0px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }

  .news-text {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #cccccc;
    line-height: 1.4;
    letter-spacing: 0.02em;
  }

  .news-source {
    font-size: 9px;
    color: #555;
    margin-left: 3px;
  }

  .news-status {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #555;
    text-align: center;
    padding: 8px 0;
    letter-spacing: 0.05em;
  }

  .news-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: #e05555;
    width: 0%;
    border-radius: 0 0 0 18px;
  }

  /* ============ SETTINGS BAR ============ */
  /* position:fixed is broken on Kindle — use sticky in flow instead */
  .settings-bar {
    width: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 8px;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    padding: 8px 0 4px 0;
  }

  .settings-btn {
    background: #1a1a1a;
    border: none;
    border-radius: 10px;
    color: #aaaaaa;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 0.05em;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Settings panel */
  .settings-panel {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  .settings-panel.open { display: -webkit-box; display: -webkit-flex; display: flex; }

  .settings-box {
    background: #1a1a1a;
    border-radius: 16px;
    padding: 22px 24px;
    min-width: 260px;
    max-width: 320px;
    color: #cccccc;
    font-family: 'Courier New', monospace;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 14px;
    max-height: 85%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .settings-box h2 {
    font-size: 13px;
    letter-spacing: 0.1em;
    color: #ffffff;
    text-transform: uppercase;
    margin-bottom: 2px;
    font-family: Georgia, serif;
  }
  .settings-box label {
    font-size: 10px;
    letter-spacing: 0.07em;
    color: #777;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }
  .settings-box input, .settings-box select {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 7px;
    color: #cccccc;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .settings-save {
    background: #e05555;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 9px;
    cursor: pointer;
    text-transform: uppercase;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .settings-close {
    background: #2a2a2a;
    border: none;
    border-radius: 8px;
    color: #aaa;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 9px;
    cursor: pointer;
    text-transform: uppercase;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .settings-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 8px;
  }
  .settings-row > * { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }

</style>
</head>
<body>

<!-- Wrap everything in a scrollable container so position:fixed isn't needed -->
<div id="page-wrap" style="display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:100vh;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;">

  <div id="rotation-wrapper">
    <div class="dashboard">

      <div class="top-row">

        <!-- CLOCK -->
        <div class="card clock-card">
          <div class="clock-face" id="clockFace">
            <svg id="clockSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
              <g id="tickGroup"></g>
              <line id="hourHand"   x1="50" y1="50" x2="50" y2="24" stroke="#1a1a1a" stroke-width="4"   stroke-linecap="round"/>
              <line id="minuteHand" x1="50" y1="50" x2="50" y2="17" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
              <line id="secondHand" x1="50" y1="50" x2="50" y2="14" stroke="#c8860a" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="50" cy="50" r="4"   fill="#c8860a"/>
              <circle cx="50" cy="50" r="1.8" fill="#1a1a1a"/>
            </svg>
          </div>
          <div class="time-label" id="timeLabel">--:-- --</div>
        </div>

        <!-- CALENDAR -->
        <div class="card calendar-card" id="calendarCard"></div>

        <!-- WEATHER -->
        <div class="card weather-card" id="weatherCard">
          <div class="weather-loading">Loading weather...</div>
        </div>

      </div><!-- /top-row -->

      <!-- NEWS PANEL -->
      <div class="news-card" id="newsCard">
        <div class="news-header">
          <div class="news-category-tabs" id="newsTabs">
            <button class="news-tab active" data-cat="tech">TECH</button>
            <button class="news-tab" data-cat="science">SCI</button>
            <button class="news-tab" data-cat="business">BIZ</button>
            <button class="news-tab" data-cat="sports">SPORT</button>
          </div>
        </div>
        <div class="news-items" id="newsItems">
          <div class="news-status">Loading headlines...</div>
        </div>
        <div class="news-progress" id="newsProgress"></div>
      </div>

      <!-- Settings bar (in-flow, not fixed) -->
      <div class="settings-bar">
        <button class="settings-btn" id="settingsOpenBtn">Settings</button>
      </div>

    </div><!-- /dashboard -->
  </div><!-- /rotation-wrapper -->

  <!-- Settings Panel — absolute inside page-wrap -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-box">
      <h2>Dashboard Settings</h2>

      <div>
        <label>City Name</label>
        <input type="text" id="settingCity" placeholder="e.g. Atlanta" />
      </div>

      <div>
        <label>Temperature Unit</label>
        <select id="settingUnit">
          <option value="imperial">Fahrenheit (F)</option>
          <option value="metric">Celsius (C)</option>
        </select>
      </div>

      <div>
        <label>Timezone (UTC offset)</label>
        <select id="settingTimezone">
          <option value="-12">UTC-12 (Baker Island)</option>
          <option value="-11">UTC-11 (American Samoa)</option>
          <option value="-10">UTC-10 (Hawaii)</option>
          <option value="-9">UTC-9 (Alaska)</option>
          <option value="-8">UTC-8 (Pacific Time)</option>
          <option value="-7">UTC-7 (Mountain Time)</option>
          <option value="-6">UTC-6 (Central Time)</option>
          <option value="-5">UTC-5 (Eastern Time)</option>
          <option value="-4">UTC-4 (Atlantic / EDT)</option>
          <option value="-3">UTC-3 (Buenos Aires)</option>
          <option value="-2">UTC-2 (Mid-Atlantic)</option>
          <option value="-1">UTC-1 (Azores)</option>
          <option value="0">UTC+0 (London / GMT)</option>
          <option value="1">UTC+1 (Paris / Berlin)</option>
          <option value="2">UTC+2 (Athens / Cairo)</option>
          <option value="3">UTC+3 (Moscow / Riyadh)</option>
          <option value="3.5">UTC+3:30 (Tehran)</option>
          <option value="4">UTC+4 (Dubai / Baku)</option>
          <option value="4.5">UTC+4:30 (Kabul)</option>
          <option value="5">UTC+5 (Karachi)</option>
          <option value="5.5">UTC+5:30 (India / IST)</option>
          <option value="5.75">UTC+5:45 (Nepal)</option>
          <option value="6">UTC+6 (Dhaka)</option>
          <option value="6.5">UTC+6:30 (Yangon)</option>
          <option value="7">UTC+7 (Bangkok)</option>
          <option value="8">UTC+8 (China / Singapore)</option>
          <option value="9">UTC+9 (Tokyo / Seoul)</option>
          <option value="9.5">UTC+9:30 (Adelaide)</option>
          <option value="10">UTC+10 (Sydney)</option>
          <option value="11">UTC+11 (Solomon Islands)</option>
          <option value="12">UTC+12 (Auckland / Fiji)</option>
        </select>
      </div>

      <div>
        <label>Page Rotation</label>
        <select id="settingRotation">
          <option value="0">Normal (0 deg)</option>
          <option value="90">90 deg Clockwise</option>
          <option value="180">Upside Down (180 deg)</option>
          <option value="270">90 deg Counter-Clockwise</option>
        </select>
      </div>

      <br>
      <div class="settings-row">
        <button class="settings-save" id="settingsSaveBtn">Save</button>
        <button class="settings-close" id="settingsCloseBtn">Cancel</button>
      </div>
    </div>
  </div>

</div><!-- /page-wrap -->

<script>
// ─── COMPAT HELPERS ──────────────────────────────────────────────────────────
// Avoid arrow functions and const/let where Kindle WebKit may choke.
// Use var everywhere, classic function declarations, no template literals.

// Safe localStorage wrapper (may be blocked on Kindle)
var storage = (function() {
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    return localStorage;
  } catch(e) {
    // Fallback: in-memory store
    var mem = {};
    return {
      getItem: function(k) { return mem[k] !== undefined ? mem[k] : null; },
      setItem: function(k, v) { mem[k] = String(v); },
      removeItem: function(k) { delete mem[k]; }
    };
  }
})();

// ─── STORAGE ─────────────────────────────────────────────────────────────────
var STORAGE_KEY = 'kindle_dashboard_v2';

function loadPrefs() {
  try {
    var raw = storage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function savePrefs(obj) {
  try { storage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch(e) {}
}

var prefs = loadPrefs();
if (!prefs.city)              prefs.city     = 'Atlanta';
if (!prefs.unit)              prefs.unit     = 'imperial';
if (!prefs.rotation)          prefs.rotation = '0';
if (prefs.tzOffset === undefined) prefs.tzOffset = -5;

// ─── SETTINGS UI ─────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settingCity').value     = prefs.city;
  document.getElementById('settingUnit').value     = prefs.unit;
  document.getElementById('settingRotation').value = prefs.rotation;
  document.getElementById('settingTimezone').value = String(prefs.tzOffset);
  document.getElementById('settingsPanel').className = 'settings-panel open';
}
function closeSettings() {
  document.getElementById('settingsPanel').className = 'settings-panel';
}
function saveSettings() {
  prefs.city     = document.getElementById('settingCity').value || 'Atlanta';
  prefs.unit     = document.getElementById('settingUnit').value;
  prefs.rotation = document.getElementById('settingRotation').value;
  prefs.tzOffset = parseFloat(document.getElementById('settingTimezone').value);
  savePrefs(prefs);
  closeSettings();
  applyRotation();
  fetchWeather();
}

document.getElementById('settingsOpenBtn').onclick  = openSettings;
document.getElementById('settingsSaveBtn').onclick  = saveSettings;
document.getElementById('settingsCloseBtn').onclick = closeSettings;

// ─── ROTATION ────────────────────────────────────────────────────────────────
var rotations = ['0','90','180','270'];
function applyRotation() {
  var w = document.getElementById('rotation-wrapper');
  w.className = '';
  if (prefs.rotation !== '0') w.className = 'rotate-' + prefs.rotation;
}

// ─── CLOCK ───────────────────────────────────────────────────────────────────
(function buildTicks() {
  var g = document.getElementById('tickGroup');
  for (var i = 0; i < 60; i++) {
    var angle = (i / 60) * 360;
    var isMajor = (i % 5 === 0);
    var rad = (angle - 90) * Math.PI / 180;
    var r1 = isMajor ? 40 : 43;
    var r2 = 47;
    var x1 = 50 + r1 * Math.cos(rad);
    var y1 = 50 + r1 * Math.sin(rad);
    var x2 = 50 + r2 * Math.cos(rad);
    var y2 = 50 + r2 * Math.sin(rad);
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? '#555555' : '#aaaaaa');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);
  }
})();

function rotateHand(el, deg) {
  el.setAttribute('transform', 'rotate(' + deg + ' 50 50)');
}

function getAdjustedTime() {
  var now = new Date();
  var utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  var tzMs  = prefs.tzOffset * 3600000;
  return new Date(utcMs + tzMs);
}

function updateClock() {
  var now = getAdjustedTime();
  var s   = now.getSeconds();
  var m   = now.getMinutes();
  var h   = now.getHours() % 12;

  rotateHand(document.getElementById('secondHand'), s * 6);
  rotateHand(document.getElementById('minuteHand'), m * 6 + s * 0.1);
  rotateHand(document.getElementById('hourHand'),   h * 30 + m * 0.5);

  var hr = now.getHours();
  var ampm = hr >= 12 ? 'PM' : 'AM';
  if (hr > 12) hr -= 12;
  if (hr === 0) hr = 12;
  var mm = m < 10 ? '0' + m : String(m);
  document.getElementById('timeLabel').textContent = hr + ':' + mm + ' ' + ampm;
}

setInterval(updateClock, 1000);
updateClock();

// ─── CALENDAR ────────────────────────────────────────────────────────────────
function buildCalendar() {
  var now   = getAdjustedTime();
  var year  = now.getFullYear();
  var month = now.getMonth();
  var today = now.getDate();
  var monthNames = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                    'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  var dayNames = ['S','M','T','W','T','F','S'];
  var firstDay  = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();

  var html = '<div class="cal-header"><span class="cal-month">'
    + monthNames[month] + '</span><span class="cal-year">' + year + '</span></div>'
    + '<div class="cal-grid">';

  for (var di = 0; di < dayNames.length; di++) {
    html += '<div class="cal-day-name">' + dayNames[di] + '</div>';
  }
  for (var i = 0; i < firstDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    html += '<div class="cal-day' + (d === today ? ' today' : '') + '">' + d + '</div>';
  }
  var remainder = (firstDay + daysInMonth) % 7;
  if (remainder > 0) {
    for (var j = 0; j < (7 - remainder); j++) {
      html += '<div class="cal-day other-month"></div>';
    }
  }
  html += '</div>';
  document.getElementById('calendarCard').innerHTML = html;
}
buildCalendar();

// ─── WEATHER ─────────────────────────────────────────────────────────────────
var API_KEY = '0264a07ef00385ae3a6ea69858c85c52';

// Text-based weather icons — emoji are unreliable on Kindle e-ink
var weatherIcons = {
  'Clear':        '☀️',
  'Clouds':       '☁️',
  'Rain':         '🌧️',
  'Drizzle':      '🌦️',
  'Thunderstorm': '⛈️',
  'Snow':         '❄️',
  'Mist':         '🌫️',
  'Fog':          '🌫️',
  'Haze':         '🌁',
  'Smoke':        '🌫️',
  'Dust':         '💨',
  'Sand':         '💨',
  'Ash':          '🌋',
  'Squall':       '💨',
  'Tornado':      '🌪️'
};

function fetchWeather() {
  var card = document.getElementById('weatherCard');
  var unit = prefs.unit;
  var unitSymbol = unit === 'imperial' ? 'F' : 'C';
  card.innerHTML = '<div class="weather-loading">Fetching weather...</div>';

  var url = 'https://api.openweathermap.org/data/2.5/weather?q='
    + encodeURIComponent(prefs.city)
    + '&appid=' + API_KEY
    + '&units=' + unit;

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 15000;

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        var main = data.weather[0].main;
        var desc = data.weather[0].description;
        var temp = Math.round(data.main.temp);
        var feelsLike = Math.round(data.main.feels_like);
        var humidity = data.main.humidity;
        var windSpeed = Math.round(data.wind.speed);
        var wind = unit === 'imperial' ? (windSpeed + ' mph') : (windSpeed + ' m/s');
        var icon = weatherIcons[main] || '🌡️';
        card.innerHTML =
          '<div class="weather-city">' + data.name.toUpperCase() + '</div>' +
          '<div class="weather-icon">' + icon + '</div>' +
          '<div class="weather-temp">' + temp + '&deg;' + unitSymbol + '</div>' +
          '<div class="weather-desc">' + desc + '</div>' +
          '<div class="weather-meta">' +
            '<div class="weather-meta-item">FEELS LIKE<span>' + feelsLike + '&deg;' + unitSymbol + '</span></div>' +
            '<div class="weather-meta-item">HUMIDITY<span>' + humidity + '%</span></div>' +
            '<div class="weather-meta-item full">WIND<span>' + wind + '</span></div>' +
          '</div>';
      } catch(e) {
        card.innerHTML = '<div class="weather-error">Parse error</div>';
      }
    } else if (xhr.status === 404) {
      card.innerHTML = '<div class="weather-error">City not found</div>';
    } else if (xhr.status === 401) {
      card.innerHTML = '<div class="weather-error">Invalid API key</div>';
    } else {
      card.innerHTML = '<div class="weather-error">Error ' + xhr.status + '</div>';
    }
  };
  xhr.ontimeout = function() { card.innerHTML = '<div class="weather-error">Timed out</div>'; };
  xhr.onerror   = function() { card.innerHTML = '<div class="weather-error">Network error</div>'; };
  xhr.send();
}
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);

// ─── NEWS ─────────────────────────────────────────────────────────────────────
var NEWS_ROTATE_MS  = 5 * 60 * 1000;
var NEWS_CATEGORIES = ['tech', 'science', 'business', 'sports'];

var newsCache = {};
var newsCurrentCat = 'tech';
var newsRotateTimer = null;
var newsCatIndex = 0;
var newsCountdownInterval = null;
var newsRotateAt = 0;

var newsFeeds = {
  tech:     'https://news.google.com/rss/search?q=technology&hl=en-US&gl=US&ceid=US:en',
  science:  'https://news.google.com/rss/search?q=science&hl=en-US&gl=US&ceid=US:en',
  business: 'https://news.google.com/rss/search?q=business&hl=en-US&gl=US&ceid=US:en',
  sports:   'https://news.google.com/rss/search?q=sports&hl=en-US&gl=US&ceid=US:en'
};

// Manual XML item parser — DOMParser('text/xml') is unreliable on Kindle WebKit
function parseRssItems(xml) {
  var results = [];
  // Find all <item>...</item> blocks
  var itemRe = /<item[\s>][\s\S]*?<\/item>/gi;
  var items = xml.match(itemRe);
  if (!items) return results;
  for (var i = 0; i < Math.min(items.length, 4); i++) {
    var block = items[i];
    // Extract <title>...</title> (handles CDATA)
    var titleMatch = block.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/i);
    var raw = titleMatch ? titleMatch[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim() : 'Untitled';
    var dashIdx = raw.lastIndexOf(' - ');
    results.push({
      title:  dashIdx > 0 ? raw.slice(0, dashIdx) : raw,
      source: dashIdx > 0 ? raw.slice(dashIdx + 3) : ''
    });
  }
  return results;
}

// XHR-based fetch with two CORS proxies; no async/await
function fetchWithProxyXhr(feedUrl, callback) {
  var encoded = encodeURIComponent(feedUrl);
  var proxies = [
    { url: 'https://api.allorigins.win/get?url=' + encoded, json: true },
    { url: 'https://corsproxy.io/?url=' + encoded,          json: false }
  ];
  var tried = 0;

  function tryNext() {
    if (tried >= proxies.length) { callback(null); return; }
    var proxy = proxies[tried++];
    var xhr = new XMLHttpRequest();
    xhr.open('GET', proxy.url, true);
    xhr.timeout = 12000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        var text = xhr.responseText;
        try {
          if (proxy.json) {
            var data = JSON.parse(text);
            if (data && data.contents) { callback(data.contents); return; }
          } else {
            if (text.indexOf('<rss') !== -1 || text.indexOf('<feed') !== -1) {
              callback(text); return;
            }
          }
        } catch(e) {}
        tryNext();
      } else {
        tryNext();
      }
    };
    xhr.ontimeout = tryNext;
    xhr.onerror   = tryNext;
    xhr.send();
  }
  tryNext();
}

function fetchNewsCategory(cat, callback) {
  if (newsCache[cat]) { callback(newsCache[cat]); return; }

  fetchWithProxyXhr(newsFeeds[cat], function(xml) {
    if (!xml) {
      callback([{ title: 'Could not load headlines. Check connection.', source: '' }]);
      return;
    }
    var headlines = parseRssItems(xml);
    if (headlines.length === 0) {
      headlines = [{ title: 'No headlines available right now.', source: '' }];
    }
    newsCache[cat] = headlines;
    callback(headlines);
  });
}

function renderNewsItems(headlines) {
  var container = document.getElementById('newsItems');
  if (!headlines || headlines.length === 0) {
    container.innerHTML = '<div class="news-status">No headlines available</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < headlines.length; i++) {
    var h = headlines[i];
    var title  = typeof h === 'object' ? h.title  : h;
    var source = typeof h === 'object' ? h.source : '';
    html += '<div class="news-item">'
      + '<span class="news-bullet">&#8250;</span>'
      + '<span class="news-text">' + title
      + (source ? '<span class="news-source">-- ' + source + '</span>' : '')
      + '</span></div>';
  }
  container.innerHTML = html;
}

function showNewsCategory(cat) {
  newsCurrentCat = cat;

  // Update tab UI
  var tabs = document.getElementById('newsTabs').getElementsByTagName('button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = tabs[i].getAttribute('data-cat') === cat
      ? 'news-tab active' : 'news-tab';
  }

  if (!newsCache[cat]) {
    document.getElementById('newsItems').innerHTML =
      '<div class="news-status">Fetching ' + cat + ' headlines...</div>';
  }

  fetchNewsCategory(cat, function(headlines) {
    if (newsCurrentCat === cat) renderNewsItems(headlines);
  });
}

function startNewsRotation() {
  if (newsRotateTimer)       clearInterval(newsRotateTimer);
  if (newsCountdownInterval) clearInterval(newsCountdownInterval);

  newsRotateAt = Date.now() + NEWS_ROTATE_MS;
  startCountdown();

  newsRotateTimer = setInterval(function() {
    newsCatIndex = (newsCatIndex + 1) % NEWS_CATEGORIES.length;
    var nextCat = NEWS_CATEGORIES[newsCatIndex];
    showNewsCategory(nextCat);
    newsRotateAt = Date.now() + NEWS_ROTATE_MS;
    // Pre-fetch next
    var afterNext = NEWS_CATEGORIES[(newsCatIndex + 1) % NEWS_CATEGORIES.length];
    fetchNewsCategory(afterNext, function() {});
  }, NEWS_ROTATE_MS);
}

function startCountdown() {
  if (newsCountdownInterval) clearInterval(newsCountdownInterval);
  var progress = document.getElementById('newsProgress');

  newsCountdownInterval = setInterval(function() {
    var remaining = Math.max(0, newsRotateAt - Date.now());
    var pct = ((NEWS_ROTATE_MS - remaining) / NEWS_ROTATE_MS) * 100;
    progress.style.width = pct + '%';
  }, 1000);
}

// Tab click handlers (use onclick attribute since addEventListener may be flaky on old WebKit)
var tabs = document.getElementById('newsTabs').getElementsByTagName('button');
for (var ti = 0; ti < tabs.length; ti++) {
  (function(btn) {
    btn.onclick = function() {
      var cat = btn.getAttribute('data-cat');
      newsCatIndex = NEWS_CATEGORIES.indexOf(cat);
      showNewsCategory(cat);
      newsRotateAt = Date.now() + NEWS_ROTATE_MS;
      var progress = document.getElementById('newsProgress');
      progress.style.width = '0%';
    };
  })(tabs[ti]);
}

// Init news
showNewsCategory('tech');
// Stagger so the first request isn't competing
setTimeout(startNewsRotation, 500);
setTimeout(function() { fetchNewsCategory('science',  function(){}); }, 2000);
setTimeout(function() { fetchNewsCategory('business', function(){}); }, 3500);
setTimeout(function() { fetchNewsCategory('sports',   function(){}); }, 5000);
// Refresh caches every hour
setInterval(function() { newsCache = {}; }, 60 * 60 * 1000);

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyRotation();
</script>
